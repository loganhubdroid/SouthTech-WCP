<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>10-1 Shapes</title>
		<style>
			.test {
				margin-left: 60px;
			}
		</style>
	</head>
	<body>
		<svg width="500" height="200">
			<rect x="10" y="20" width="100" height="500" stroke="black" fill="black" />
			<circle cx="60" cy="50" r="20" stroke="red" stroke-width="5" fill="red" />
			<circle cx="60" cy="110" r="20" stroke="yellow" stroke-width="5" fill="yellow" />
			<circle cx="60" cy="170" r="20" stroke="green" stroke-width="5" fill="green" />
		</svg>
		<br>
		<svg width="700" height="200">
			<rect x="140" y="20" width="200" height="500" stroke="brown" fill="brown" />
			<rect x="260" y="140" width="40" height="60" stroke="black" fill="black" />
  			<polygon points="100,10 150,190 50,190" style="fill:grey;stroke:grey;stroke-width:3" />
			<rect x="280" y="-40" width="40" height="60" stroke="grey" fill="grey" />
		</svg>
		<br>
		<svg class="test" width="500" height="600">
			<circle cx="60" cy="210" r="50" stroke="black" stroke-width="1" fill="white" />
			<circle cx="60" cy="140" r="40" stroke="black" stroke-width="1" fill="white" />
			<circle cx="60" cy="85" r="30" stroke="black" stroke-width="1" fill="white" />
			<rect x="30" y="20" width="60" height="40" stroke="black" fill="black" />
			<rect x="20" y="60" width="80" height="5" stroke="black" fill="black" />
		</svg>
	</body>
</html>
