	<body>
		<header>
			<h1>Gaming Information</h1>
		</header>
		<main>
			<form name="pizza" id="pizza" method="get" action="uh.jpg">
					<p>Enter Name: <input type="text" name="name" id="name" placeholder="Student name" required></p>
					<p>Enter Password: <input type="password" name="pw" id="pw" minlength="8" placeholder="Password" required></p>
					<p>Enter number of years gaming: <input type="text" name="years" id="years" minlength="1" placeholder="Age" required></p>

					<p>Number of hours played weekly:</p>
					<p><input type="radio" name="hours" value="5">&lt;5 hours a week</p>
					<p><input type="radio" name="hours" value="more">5 to 10 hours a week</p>
					<p><input type="radio" name="hours" value="10">&gt;10 hours a week</p>

					<p>Gaming Console:</p>
					<p><input type="checkbox" name="console1" value="xobx">Microsoft Xbo</p>
					<p><input type="checkbox" name="colsole2" value="ps5">Sony PlayStation 5</p>
					<p><input type="checkbox" name="console3" value="switch">Nintendo Switch</p>
					<p><input type="checkbox" name="console4" value="other">other</p>
					<br>

					<p><input type="submit" id="submit" value="Submit"><input type="reset" id="reset" value="Reset"></p>
			</form>
		</main>
